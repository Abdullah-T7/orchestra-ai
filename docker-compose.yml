services:
  frontend:
    build: ./frontend-professional
    container_name: orchestra_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend-professional:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws/missions
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: command_center_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://user:password@postgres:5432/command_center
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:1b}
    depends_on:
      - redis
      - postgres
      - ollama

  ollama:
    image: ollama/ollama
    container_name: orchestra_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  redis:
    image: redis:7-alpine
    container_name: command_center_redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    container_name: command_center_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: command_center
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  ollama_data:
