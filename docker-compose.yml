services:
  backend:
    build: ./backend
    container_name: command_center_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://user:password@postgres:5432/command_center
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      - redis
      - postgres

  redis:
    image: redis:7-alpine
    container_name: command_center_redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    container_name: command_center_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: command_center
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

